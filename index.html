<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/scrapify.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scrapify - All-in-One Data Scraper</title>
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #fff;
        z-index: 9999;
        transition: opacity 0.4s ease, transform 0.4s ease;
      }
      #app-loader.hidden {
        opacity: 0;
        transform: scale(1.04);
        pointer-events: none;
      }
      #app-loader img {
        width: 180px;
        height: auto;
        animation: logoPulse 1.1s ease-in-out infinite;
      }
      #app-loader .loader-dots {
        display: flex;
        gap: 6px;
        margin-top: 24px;
      }
      #app-loader .loader-dots span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #5B4FE8;
        animation: dotBounce 1.1s ease-in-out infinite;
      }
      #app-loader .loader-dots span:nth-child(2) { animation-delay: 0.18s; }
      #app-loader .loader-dots span:nth-child(3) { animation-delay: 0.36s; }
      @keyframes logoPulse {
        0%, 100% { opacity: 1;    transform: scale(1);    }
        50%       { opacity: 0.5; transform: scale(0.97); }
      }
      @keyframes dotBounce {
        0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; }
        40%           { transform: scale(1);   opacity: 1;   }
      }
    </style>
  </head>
  <body>
    <!-- Capture load start time before anything else -->
    <script>window.__loaderStart = Date.now();</script>
    <!-- Logo loader — shown immediately, hidden once React mounts -->
    <div id="app-loader">
      <img src="/scrapify.png" alt="Scrapify" />
      <div class="loader-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
